[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-devops"
license = "Apache-2.0"
dynamic = ["version"]
description = "Provenance-backed, authority-aware policy verifier for agentic DevOps actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]
keywords = [
    "agentops",
    "agent-security",
    "policy-as-code",
    "provenance",
    "kubernetes",
    "terraform",
    "guardrails",
    "prompt-injection",
    "context-poisoning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/moneytool/aegis-devops"
Repository = "https://github.com/moneytool/aegis-devops"

[project.scripts]
aegis = "aegis_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff",
]
llm = [
    "anthropic",
]

[tool.setuptools.dynamic]
version = {attr = "aegis_core.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis_core = ["_examples/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
