[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-devops"
license = "Apache-2.0"
version = "0.1.0"
description = "Provenance-backed, authority-aware policy verifier for agentic DevOps actions."
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[project.scripts]
aegis = "aegis_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff",
]
llm = [
    "anthropic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
