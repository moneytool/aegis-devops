- provider: kubernetes
  resource_pattern: deployment/*
  actions: [scale]
  scope:
    cluster: prod-us-east-1
  time_window: null
  effect: ESCALATE
  constraint_class: scaling
  rule_text: Escalate scaling deployment/* outside the allowed replica range in
