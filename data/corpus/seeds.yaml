# ---------------------------------------------------------------------------
# Extending the cloud-provider/Kyverno source family to other parsers
# (provider: helm, argocd, flux, git, github, sql, mongodb, pulumi, migration,
# terraform) -- each rule_text names exactly what it extends and to where, in
# the style of the pre-existing "extending gatekeeper-library requiredlabels
# to annotations" seed.
# ---------------------------------------------------------------------------

- provider: helm
  resource_pattern: release/*
  actions: [update]
  scope:
    namespace: prod
  time_window: null
  effect: ESCALATE
  constraint_class: access
  rule_text: Escalate a Helm release upgrade whose chart values reference an image
    registry outside the allow-list, extending the Kyverno policy library `best-practices/restrict-image-registries`
    policy to Helm releases.
  origin: https://github.com/kyverno/policies/tree/main/best-practices/restrict-image-registries
  origin_kind: vendor-guidance

- provider: helm
  resource_pattern: release/*
  actions: [delete]
  scope:
    namespace: prod
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block uninstalling a Helm release in prod, extending AWS Security
    Hub FSBP control DynamoDB.6's deletion-protection intent to Helm releases.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: argocd
  resource_pattern: app/*
  actions: [update]
  scope:
    env: prod
  time_window: null
  effect: ESCALATE
  constraint_class: deployment
  rule_text: Escalate an ArgoCD app sync with `--prune` enabled in prod, extending
    the Kyverno policy library `other/block-updates-deletes` policy's intent to
    GitOps-driven deletes.
  origin: https://github.com/kyverno/policies/tree/main/other/block-updates-deletes
  origin_kind: vendor-guidance

- provider: argocd
  resource_pattern: app/*
  actions: [delete]
  scope: {}
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block deleting an ArgoCD Application, extending AWS Security Hub FSBP
    control DynamoDB.6's deletion-protection intent to ArgoCD-managed applications.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: flux
  resource_pattern: kustomization/*
  actions: [update]
  scope:
    env: prod
  time_window: null
  effect: ESCALATE
  constraint_class: configuration
  rule_text: Escalate reconciling a Flux Kustomization in prod whose resources
    are missing required labels, extending the Kyverno policy library `best-practices/require-labels`
    policy to Flux-managed Kustomizations.
  origin: https://github.com/kyverno/policies/tree/main/best-practices/require-labels
  origin_kind: vendor-guidance

- provider: flux
  resource_pattern: helmrelease/*
  actions: [delete]
  scope: {}
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block deleting a Flux HelmRelease, extending AWS Security Hub FSBP
    control DynamoDB.6's deletion-protection intent to Flux-managed HelmReleases.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: git
  resource_pattern: history/*
  actions: [rewrite]
  scope:
    repo: org/infra
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block force-pushes that rewrite published history on infra repos,
    extending the Kyverno policy library `other/verify-manifest-integrity` policy's
    supply-chain-integrity intent to the git history that produces the manifests.
  origin: https://github.com/kyverno/policies/tree/main/other/verify-manifest-integrity
  origin_kind: vendor-guidance

- provider: git
  resource_pattern: branch/*
  actions: [delete]
  scope:
    repo: org/infra
  time_window: null
  effect: ESCALATE
  constraint_class: deletion
  rule_text: Escalate deleting a release branch, extending AWS Security Hub FSBP
    control DynamoDB.6's deletion-protection intent to source-control branches.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: github
  resource_pattern: workflow/*
  actions: [run]
  scope:
    repo: org/infra
  time_window:
    days: [Mon, Tue, Wed, Thu, Fri]
    start: '09:00'
    end: '17:00'
    tz: America/New_York
  effect: ESCALATE
  constraint_class: deployment
  rule_text: Escalate running a deploy workflow during business hours, extending
    the Kyverno policy library `other/time-bound-policy` policy's window-gating
    intent to GitHub Actions workflow dispatches.
  origin: https://github.com/kyverno/policies/tree/main/other/time-bound-policy
  origin_kind: vendor-guidance

- provider: github
  resource_pattern: secret/*
  actions: [create, update]
  scope:
    repo: org/infra
  time_window: null
  effect: BLOCK
  constraint_class: access
  rule_text: Block creating or updating a repository secret without review, extending
    the GCP organization policy constraint `iam.managed.disableServiceAccountKeyCreation`'s
    credential-material-creation intent to GitHub Actions secrets.
  origin: https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  origin_kind: security-benchmark

- provider: sql
  resource_pattern: table/*
  actions: [delete]
  scope:
    database: prod
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block TRUNCATE/DROP TABLE against prod tables, extending AWS Security
    Hub FSBP control DynamoDB.6's deletion-protection intent to relational tables.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: sql
  resource_pattern: database/*
  actions: [delete]
  scope: {}
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block DROP DATABASE/DROP SCHEMA statements, extending AWS Security
    Hub FSBP control DynamoDB.6's deletion-protection intent to entire databases.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: sql
  resource_pattern: table/*
  actions: [update]
  scope:
    database: prod
  time_window: null
  effect: ESCALATE
  constraint_class: configuration
  rule_text: Escalate unbounded UPDATE statements (no WHERE clause) against prod
    tables, extending the Kyverno policy library `other/restrict-secrets-by-name`
    policy's blast-radius-limiting intent to bulk row mutation.
  origin: https://github.com/kyverno/policies/tree/main/other/restrict-secrets-by-name
  origin_kind: vendor-guidance

- provider: mongodb
  resource_pattern: collection/*
  actions: [delete]
  scope: {}
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block deleteMany calls with an empty filter (deletes every document),
    extending AWS Security Hub FSBP control EC2.1's "not publicly/unboundedly exposed"
    intent to unbounded collection deletes.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: mongodb
  resource_pattern: collection/*
  actions: [update]
  scope: {}
  time_window: null
  effect: ESCALATE
  constraint_class: configuration
  rule_text: Escalate updateMany calls with an empty filter, extending the Kyverno
    policy library `other/restrict-secrets-by-name` policy's blast-radius-limiting
    intent to bulk document mutation.
  origin: https://github.com/kyverno/policies/tree/main/other/restrict-secrets-by-name
  origin_kind: vendor-guidance

- provider: pulumi
  resource_pattern: aws/rds/instance/*
  actions: [delete, replace]
  scope:
    region: us-east-1
  time_window: null
  effect: ESCALATE
  constraint_class: deletion
  rule_text: Escalate a Pulumi preview step that deletes or replaces an RDS instance,
    extending AWS Security Hub FSBP control DynamoDB.6's deletion-protection intent
    to Pulumi-managed RDS resources.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: pulumi
  resource_pattern: stack/*
  actions: [delete]
  scope:
    stack: prod
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block `pulumi destroy` against the prod stack, extending AWS Security
    Hub FSBP control DynamoDB.6's deletion-protection intent to whole Pulumi stacks.
  origin: https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html
  origin_kind: security-benchmark

- provider: migration
  resource_pattern: database/*
  actions: [delete]
  scope: {}
  time_window: null
  effect: BLOCK
  constraint_class: deletion
  rule_text: Block `rails db:reset`/`flyway clean`-style destructive migration
