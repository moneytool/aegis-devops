  origin: https://github.com/open-policy-agent/gatekeeper-library/tree/master/library/general/block-loadbalancer-services
  origin_kind: policy-library

- provider: kubernetes
  resource_pattern: service/*
  actions: [create]
  scope:
    namespace: prod
  time_window: null
  effect: ESCALATE
  constraint_class: networking
  rule_text: Escalate creating prod service/* of type LoadBalancer, per the gatekeeper-library
    `block-loadbalancer-services` template.
  origin: https://github.com/open-policy-agent/gatekeeper-library/tree/master/library/general/block-loadbalancer-services
  origin_kind: policy-library

- provider: kubernetes
  resource_pattern: service/*
  actions: [apply]
  scope:
    region: us-east-1
  time_window: null
  effect: BLOCK
  constraint_class: networking
  rule_text: Block applying service/* of type LoadBalancer in us-east-1, per the
    gatekeeper-library `block-loadbalancer-services` template.
  origin: https://github.com/open-policy-agent/gatekeeper-library/tree/master/library/general/block-loadbalancer-services
  origin_kind: policy-library

- provider: kubernetes
  resource_pattern: deployment/*
  actions: [apply, create]
  scope: {}
  time_window: null
  effect: ESCALATE
  constraint_class: configuration
  rule_text: Escalate applying deployment/* missing required annotations, extending
    the gatekeeper-library `requiredlabels` pattern to annotations (see the sibling
    `requiredannotations` template in the same library).
  origin: https://github.com/open-policy-agent/gatekeeper-library/tree/master/library/general/requiredlabels
