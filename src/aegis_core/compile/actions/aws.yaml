# AWS action map (docs/dev/DESIGN-v0.3-server-side.md §6.4).
#
# Maps each (resource type, action) the aws CLI parser produces to the IAM
# permissions and resource ARNs a compiled Deny must name. Reviewed like
# policy: anything not listed here is "not enforced", never widened.
#
# Per type:
#   arn        ARN template(s): {partition} {account} {name}; {name} becomes
#              the rule's name glob, or * when the rule covers every name
#   regional   whether aws:RequestedRegion can scope it (false: global service,
#              so a region-scoped rule is over-enforced in every region)
#   names      name   - the CLI's resource name is the ARN's name (default)
#              arn    - the CLI's resource name is the full ARN; used verbatim
#              cli-missing - the CLI parser does not extract a name for this
#                       type; a name-specific rule is compiled as written,
#                       but the client-side check never matches it
#              wildcard-only - names cannot be translated; only rules that
#                       cover every name compile
#   actions    action -> IAM permissions (on the type's arn), or a list of
#              {iam: [...], arn: [...]} for permissions on other ARNs
#   same_effect action -> what reaches the same outcome without that action;
#              listed in the coverage report when the rule does not block it
#   verified   false until a sandbox acceptance run confirms the mapping; the
#              coverage report says "unverified" for every rule that uses it
version: 1
types:
  ec2/instance:
    arn: "arn:{partition}:ec2:*:{account}:instance/{name}"
    actions:
      delete: [ec2:TerminateInstances]
      stop: [ec2:StopInstances]
      start: [ec2:StartInstances]
      restart: [ec2:RebootInstances]
      run: [ec2:RunInstances]
    same_effect:
      delete:
        - "ec2:ModifyInstanceAttribute: clearing termination protection or setting instance-initiated shutdown to terminate, then shutting down from inside"
    verified: false
  ec2/instance-attribute:
    arn: "arn:{partition}:ec2:*:{account}:instance/{name}"
    actions:
      update: [ec2:ModifyInstanceAttribute]
    verified: false
  ec2/volume:
    arn: "arn:{partition}:ec2:*:{account}:volume/{name}"
    names: cli-missing
    actions:
      delete: [ec2:DeleteVolume]
      detach: [ec2:DetachVolume]
    verified: false
  ec2/snapshot:
    arn: "arn:{partition}:ec2:*::snapshot/{name}"
    names: cli-missing
    actions:
      delete: [ec2:DeleteSnapshot]
    verified: false
  ec2/vpc:
    arn: "arn:{partition}:ec2:*:{account}:vpc/{name}"
    names: cli-missing
    actions:
      delete: [ec2:DeleteVpc]
    verified: false
  ec2/security-group:
    arn: "arn:{partition}:ec2:*:{account}:security-group/{name}"
    names: cli-missing
    actions:
      delete: [ec2:DeleteSecurityGroup]
    verified: false
  s3/bucket:
    arn: "arn:{partition}:s3:::{name}"
    actions:
      # `aws s3 rm s3://b/k` parses as delete on s3/bucket/b, so a bucket
      # delete rule blocks object deletes on the client too
      delete:
        - iam: [s3:DeleteBucket]
        - iam: [s3:DeleteObject, s3:DeleteObjectVersion]
          arn: "arn:{partition}:s3:::{name}/*"
      create: [s3:CreateBucket]
      put:
        - iam: [s3:PutObject]
          arn: "arn:{partition}:s3:::{name}/*"
        - iam: [s3:PutBucketPolicy, s3:PutBucketAcl, s3:PutLifecycleConfiguration,
                s3:PutBucketVersioning, s3:PutEncryptionConfiguration,
                s3:PutBucketPublicAccessBlock]
    same_effect:
      delete:
        - "s3:PutLifecycleConfiguration: an expiration rule deletes every object (blocked only if the rule also blocks put)"
        - "s3:PutBucketPolicy: a deny-all bucket policy locks everyone out (blocked only if the rule also blocks put)"
    verified: false
  s3/object:
    arn: "arn:{partition}:s3:::{name}"
    actions:
      delete: [s3:DeleteObject, s3:DeleteObjectVersion]
      put: [s3:PutObject]
    verified: false
  rds/db-instance:
    arn: "arn:{partition}:rds:*:{account}:db:{name}"
    actions:
      delete: [rds:DeleteDBInstance]
      update: [rds:ModifyDBInstance]
      stop: [rds:StopDBInstance]
      start: [rds:StartDBInstance]
      restart: [rds:RebootDBInstance]
    same_effect:
      delete:
        - "rds:ModifyDBInstance: BackupRetentionPeriod=0 deletes the automated backups (blocked only if the rule also blocks update)"
    verified: false
  rds/db-cluster:
    arn: "arn:{partition}:rds:*:{account}:cluster:{name}"
    names: cli-missing
    actions:
      delete: [rds:DeleteDBCluster]
      update: [rds:ModifyDBCluster]
    verified: false
  rds/db-snapshot:
    arn: "arn:{partition}:rds:*:{account}:snapshot:{name}"
    names: cli-missing
    actions:
      delete: [rds:DeleteDBSnapshot]
    verified: false
  rds/db-cluster-snapshot:
    arn: "arn:{partition}:rds:*:{account}:cluster-snapshot:{name}"
    names: cli-missing
    actions:
      delete: [rds:DeleteDBClusterSnapshot]
    verified: false
  dynamodb/table:
    arn: "arn:{partition}:dynamodb:*:{account}:table/{name}"
    actions:
      delete: [dynamodb:DeleteTable]
      update: [dynamodb:UpdateTable]
    same_effect:
      delete:
        - "dynamodb:DeleteItem / BatchWriteItem: emptying the table item by item"
    verified: false
  eks/cluster:
    arn: "arn:{partition}:eks:*:{account}:cluster/{name}"
    names: cli-missing
    actions:
      delete: [eks:DeleteCluster]
      update: [eks:UpdateClusterConfig, eks:UpdateClusterVersion]
    verified: false
  eks/nodegroup:
    arn: "arn:{partition}:eks:*:{account}:nodegroup/*/{name}/*"
    names: cli-missing
    actions:
      delete: [eks:DeleteNodegroup]
      update: [eks:UpdateNodegroupConfig, eks:UpdateNodegroupVersion]
    verified: false
  iam/role:
    arn: ["arn:{partition}:iam::{account}:role/{name}",
          "arn:{partition}:iam::{account}:role/*/{name}"]
    regional: false
    actions:
      delete: [iam:DeleteRole]
      create: [iam:CreateRole]
      update: [iam:UpdateRole, iam:UpdateRoleDescription]
    verified: false
  iam/role-policy:
    arn: ["arn:{partition}:iam::{account}:role/{name}",
          "arn:{partition}:iam::{account}:role/*/{name}"]
    regional: false
    actions:
      update: [iam:AttachRolePolicy, iam:PutRolePolicy]
      detach: [iam:DetachRolePolicy]
      delete: [iam:DeleteRolePolicy]
    verified: false
  iam/assume-role-policy:
    arn: ["arn:{partition}:iam::{account}:role/{name}",
          "arn:{partition}:iam::{account}:role/*/{name}"]
    regional: false
    actions:
      update: [iam:UpdateAssumeRolePolicy]
    verified: false
  iam/user:
    arn: ["arn:{partition}:iam::{account}:user/{name}",
          "arn:{partition}:iam::{account}:user/*/{name}"]
    regional: false
    actions:
      delete: [iam:DeleteUser]
      create: [iam:CreateUser]
    verified: false
  iam/user-policy:
    arn: ["arn:{partition}:iam::{account}:user/{name}",
          "arn:{partition}:iam::{account}:user/*/{name}"]
    regional: false
    actions:
      update: [iam:AttachUserPolicy, iam:PutUserPolicy]
      detach: [iam:DetachUserPolicy]
      delete: [iam:DeleteUserPolicy]
    verified: false
  iam/access-key:
    arn: ["arn:{partition}:iam::{account}:user/{name}",
          "arn:{partition}:iam::{account}:user/*/{name}"]
    regional: false
    actions:
      update: [iam:CreateAccessKey, iam:UpdateAccessKey]
      delete: [iam:DeleteAccessKey]
    verified: false
  iam/login-profile:
    arn: ["arn:{partition}:iam::{account}:user/{name}",
          "arn:{partition}:iam::{account}:user/*/{name}"]
    regional: false
    actions:
      update: [iam:CreateLoginProfile, iam:UpdateLoginProfile]
      delete: [iam:DeleteLoginProfile]
    verified: false
  lambda/function:
    arn: "arn:{partition}:lambda:*:{account}:function:{name}"
    actions:
      delete: [lambda:DeleteFunction]
      create: [lambda:CreateFunction]
    verified: false
  lambda/function-code:
    arn: "arn:{partition}:lambda:*:{account}:function:{name}"
    actions:
      update: [lambda:UpdateFunctionCode]
    verified: false
  lambda/function-configuration:
    arn: "arn:{partition}:lambda:*:{account}:function:{name}"
    actions:
      update: [lambda:UpdateFunctionConfiguration]
    verified: false
  cloudformation/stack:
    arn: "arn:{partition}:cloudformation:*:{account}:stack/{name}/*"
    actions:
      delete: [cloudformation:DeleteStack]
      update: [cloudformation:UpdateStack]
      create: [cloudformation:CreateStack]
    same_effect:
      delete:
        - "cloudformation:UpdateStack / ExecuteChangeSet: removing resources from the template deletes them (UpdateStack blocked only if the rule also blocks update)"
    verified: false
  kms/key:
    arn: "arn:{partition}:kms:*:{account}:key/{name}"
    actions:
      disable: [kms:DisableKey]
    verified: false
  kms/key-deletion:
    arn: "arn:{partition}:kms:*:{account}:key/{name}"
    actions:
      schedule: [kms:ScheduleKeyDeletion]
    same_effect:
      schedule:
        - "kms:DisableKey: makes everything encrypted under the key unreadable until re-enabled"
    verified: false
  secretsmanager/secret:
    arn: "arn:{partition}:secretsmanager:*:{account}:secret:{name}-??????"
    actions:
      delete: [secretsmanager:DeleteSecret]
      update: [secretsmanager:UpdateSecret]
    verified: false
  secretsmanager/secret-value:
    arn: "arn:{partition}:secretsmanager:*:{account}:secret:{name}-??????"
    actions:
      put: [secretsmanager:PutSecretValue]
    verified: false
  logs/log-group:
    arn: ["arn:{partition}:logs:*:{account}:log-group:{name}",
          "arn:{partition}:logs:*:{account}:log-group:{name}:*"]
    names: cli-missing
    actions:
      delete: [logs:DeleteLogGroup]
    verified: false
  ecr/repository:
    arn: "arn:{partition}:ecr:*:{account}:repository/{name}"
    actions:
      delete: [ecr:DeleteRepository]
    verified: false
  autoscaling/auto-scaling-group:
    arn: "arn:{partition}:autoscaling:*:{account}:autoScalingGroup:*:autoScalingGroupName/{name}"
    actions:
      delete: [autoscaling:DeleteAutoScalingGroup]
      scale: [autoscaling:SetDesiredCapacity, autoscaling:UpdateAutoScalingGroup]
      update: [autoscaling:UpdateAutoScalingGroup]
    verified: false
  ecs/cluster:
    arn: "arn:{partition}:ecs:*:{account}:cluster/{name}"
    actions:
      delete: [ecs:DeleteCluster]
    verified: false
  ecs/service:
    arn: "arn:{partition}:ecs:*:{account}:service/*/{name}"
    names: cli-missing
    actions:
      delete: [ecs:DeleteService]
      update: [ecs:UpdateService]
    verified: false
  elbv2/load-balancer:
    arn: "arn:{partition}:elasticloadbalancing:*:{account}:loadbalancer/*"
    names: arn
    actions:
      delete: [elasticloadbalancing:DeleteLoadBalancer]
    verified: false
  route53/hosted-zone:
    arn: "arn:{partition}:route53:::hostedzone/{name}"
    regional: false
    names: cli-missing
    actions:
      delete: [route53:DeleteHostedZone]
    verified: false
  efs/file-system:
    arn: "arn:{partition}:elasticfilesystem:*:{account}:file-system/{name}"
    names: cli-missing
    actions:
      delete: [elasticfilesystem:DeleteFileSystem]
    verified: false
  sns/topic:
    arn: "arn:{partition}:sns:*:{account}:*"
    names: arn
    actions:
      delete: [sns:DeleteTopic]
    verified: false
  sqs/queue:
    arn: "arn:{partition}:sqs:*:{account}:*"
    names: wildcard-only
    actions:
      delete: [sqs:DeleteQueue]
    verified: false
  elasticache/cache-cluster:
    arn: "arn:{partition}:elasticache:*:{account}:cluster:{name}"
    names: cli-missing
    actions:
      delete: [elasticache:DeleteCacheCluster]
    verified: false
  organizations/organization:
    arn: "*"
    regional: false
    names: wildcard-only
    actions:
      leave: [organizations:LeaveOrganization]
    verified: false
