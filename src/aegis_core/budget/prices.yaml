# Built-in model prices for the budget cap (docs/dev/DESIGN-v1.0-budget-cap.md §5).
#
# USD per million tokens, standard (non-batch, global) tier, per billing category:
#   input        uncached input tokens
#   output       output tokens, reasoning/thinking included
#   cache_read   cache hits
#   cache_write  cache writes
# A category left out is unknown for that model and falls back like an unknown model
# (on_unknown_price), for that category only.
#
# Choices that keep an estimate from running low:
# - Anthropic cache_write is the 1-hour rate (2x input); 5-minute writes cost less.
# - Google: the regular price, not the promotional one (Flash 3.6-3.8 are half price until
#   2026-12-31), and the >200k-token tier where prices depend on prompt length. Google has no
#   per-token cache write price (storage is billed per hour), so cache_write is the input rate.
# - OpenAI cache_write is the input rate.
#
# Sources, read 2026-10-07:
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://developers.openai.com/api/docs/pricing
#   https://ai.google.dev/gemini-api/docs/pricing
version: 1
as_of: "2026-10-07"
vendors:
  anthropic:
    prefixes: [claude-]
    models:
      claude-fable-5-1:  {input: 10.0, output: 50.0, cache_read: 0.25, cache_write: 20.0}
      claude-mythos-5-1: {input: 10.0, output: 50.0, cache_read: 0.25, cache_write: 20.0}
      claude-fable-5:    {input: 10.0, output: 50.0, cache_read: 1.0,  cache_write: 20.0}
