      claude-sonnet-5:   {input: 2.0,  output: 10.0, cache_read: 0.20, cache_write: 4.0}
      claude-sonnet-4-6: {input: 3.0,  output: 15.0, cache_read: 0.30, cache_write: 6.0}
      claude-sonnet-4-5: {input: 3.0,  output: 15.0, cache_read: 0.30, cache_write: 6.0}
